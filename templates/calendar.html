{% extends "base.html" %}
{% block title %}Calendar - Student Smart Planner{% endblock %}
{% block page_title %}Calendar{% endblock %}
{% block content %}

<div class="panel-card calendar-selected-panel">
    <div class="calendar-selected-header">
        <div>
            <span class="profile-eyebrow">Selected date</span>
            <h5 id="selectedDateLabel" class="mb-0" aria-live="polite"></h5>
        </div>
        <button class="btn btn-primary" id="addCalendarEventBtn" type="button"
                data-bs-toggle="modal" data-bs-target="#addCalendarEventModal">
            <i class="bi bi-plus-lg"></i> Add event on this date
        </button>
    </div>
    <div id="selectedDateEvents" class="selected-date-events" aria-live="polite"></div>
</div>

<div class="panel-card mb-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-sm btn-outline-secondary" id="prevMonth" aria-label="Previous month"><i class="bi bi-chevron-left"></i></button>
        <h5 id="calendarMonthLabel" class="mb-0"></h5>
        <button class="btn btn-sm btn-outline-secondary" id="nextMonth" aria-label="Next month"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div class="calendar-legend mb-3">
        <span class="legend-dot legend-task"></span> Task
        <span class="legend-dot legend-exam"></span> Exam
        <span class="legend-dot legend-study"></span> Study Session
        <span class="legend-dot legend-event"></span> Personal Event
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
</div>

<div class="modal fade" id="addCalendarEventModal" tabindex="-1" aria-labelledby="addCalendarEventLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('add_calendar_event') }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCalendarEventLabel">Add calendar event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="calendarEventTitle" class="form-label">Event title</label>
                        <input id="calendarEventTitle" class="form-control" type="text" name="title"
                               maxlength="150" required placeholder="e.g. Project presentation">
                    </div>
                    <div class="mb-3">
                        <label for="calendarEventDate" class="form-label">Date</label>
                        <input id="calendarEventDate" class="form-control" type="date" name="event_date" required>
                    </div>
                    <div>
                        <label for="calendarEventDescription" class="form-label">Details <span class="text-muted">(optional)</span></label>
                        <textarea id="calendarEventDescription" class="form-control" name="description"
                                  rows="3" maxlength="2000" placeholder="Add any useful notes"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save event</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const events = {{ events | tojson }};
</script>
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
